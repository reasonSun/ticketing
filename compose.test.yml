name: ticketing-test

services:
  mysql-test:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_DATABASE: ticketing_test
      MYSQL_USER: ticketing_test
      MYSQL_PASSWORD: ticketing_test_password
      MYSQL_ROOT_PASSWORD: ticketing_test_root_password
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" ticketing_test -e 'SELECT 1' > /dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s
